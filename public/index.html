
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harappa — Build • Trade • Grow</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#18130f;--panel:#241c16;--panel2:#30241b;--ink:#f7ead3;--muted:#bda98d;--gold:#d5a85b;--sand:#e9d0a1;--brick:#9a5e3a;--river:#267c91;--green:#617a50}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3a2a1d,#15100d 55%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{letter-spacing:4px;font-size:28px}.tag{color:var(--muted);font:12px Arial,sans-serif;letter-spacing:2px}
.screen{background:linear-gradient(145deg,#2b2119,#1e1712);border:1px solid #6b4d30;border-radius:20px;box-shadow:0 20px 50px #0008;overflow:hidden}
.landing{padding:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px}.hero h1{font-size:clamp(44px,7vw,78px);margin:0 0 8px;color:#f0d39c}.hero p{font:17px/1.6 Arial,sans-serif;color:#cdb99d;max-width:600px}.seal{width:170px;height:170px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:82px;margin:auto;background:#211811;box-shadow:inset 0 0 35px #000}
.form{display:grid;gap:12px;align-content:center}.input{width:100%;padding:14px;border-radius:10px;border:1px solid #765535;background:#17120e;color:white;outline:none}.input:focus{border-color:var(--gold)}.btn{border:1px solid #b78448;background:linear-gradient(#c79651,#946533);color:#1c1209;padding:13px 17px;border-radius:10px;font-weight:bold}.btn.dark{background:#3a2a1e;color:#f2dfbf;border-color:#6c4c31}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap}.small{font:12px Arial,sans-serif;color:var(--muted)}.error{color:#e99a7f;font:13px Arial,sans-serif;min-height:18px}
.lobby{padding:26px}.code{font-size:36px;letter-spacing:8px;color:#f1cf91}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.player{background:#1a1410;border:1px solid #63462d;border-radius:12px;padding:14px;min-height:100px}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:7px}.red{background:#c75b49}.gold{background:#d4a444}.jade{background:#5d9b70}.indigo{background:#5e7fb1}.ready{color:#8ed59d;font:12px Arial,sans-serif}.waiting{color:#bda98d;font:12px Arial,sans-serif}
.game{padding:14px;display:grid;grid-template-columns:1fr 330px;gap:14px}.boardWrap{min-width:0}.gamebar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}.turn{font-size:18px}.round{color:var(--gold);font-weight:bold}
.board{position:relative;aspect-ratio:1.42;background:radial-gradient(circle at 48% 42%,#d6b778 0 24%,transparent 25%),linear-gradient(145deg,#8da35f 0%,#b99a63 48%,#718e58 100%);border:6px solid #5a3925;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px #e1bd7d,inset 0 0 55px #3a281455,0 18px 38px #0008}.board:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 18%,#fff2 0 1px,transparent 2px),radial-gradient(circle at 76% 73%,#0002 0 1px,transparent 2px),repeating-linear-gradient(18deg,transparent 0 15px,#ffffff08 16px 17px);background-size:38px 38px,47px 47px,auto;pointer-events:none}.river{position:absolute;left:47%;top:-15%;height:135%;width:16%;background:linear-gradient(90deg,#174f68,#2f8292 24%,#65b5b3 48%,#2c7e8e 72%,#164e67);clip-path:polygon(28% 0,76% 0,62% 12%,78% 24%,48% 36%,66% 50%,38% 64%,72% 77%,45% 88%,63% 100%,18% 100%,34% 87%,15% 76%,39% 62%,20% 50%,47% 36%,26% 23%,43% 11%);opacity:.97;box-shadow:0 0 0 3px #16465a55}.river:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(8deg,transparent 0 19px,#b8e5dc55 20px 21px)}.bridge{position:absolute;height:18px;width:94px;background:repeating-linear-gradient(90deg,#7a4c30 0 10px,#c08a51 11px 18px);border:2px solid #4e301f;border-radius:4px;z-index:3;box-shadow:0 3px 5px #0005}.bridge.one{left:39%;top:26%;transform:rotate(-8deg)}.bridge.two{left:43%;top:69%;transform:rotate(9deg)}
.city{position:absolute;left:24%;top:25%;width:52%;height:50%;background:linear-gradient(145deg,#b87346,#d39b5e);border:11px solid #824a32;border-radius:18px;box-shadow:inset 0 0 0 3px #e4b979,inset 0 0 35px #6d3f2855,0 8px 18px #0004}.city:before,.city:after{content:"";position:absolute;background:#a85f3d;border:2px solid #75402b}.city:before{width:42%;height:22%;left:8%;bottom:9%;box-shadow:52px -3px 0 #b66b43,103px 1px 0 #a85f3d}.city:after{width:22%;height:28%;right:9%;top:10%;box-shadow:-55px 7px 0 #bd7749}.cityTitle{position:absolute;top:5px;width:100%;text-align:center;font:bold 13px Arial;color:#5a351e;letter-spacing:1px}.bath{position:absolute;left:34%;top:34%;width:32%;height:34%;background:linear-gradient(145deg,#46a9b7,#1d758d);border:7px solid #e9c987;display:grid;place-items:center;color:#fff;font:bold 11px Arial;text-align:center;box-shadow:inset 0 0 0 3px #9fd2cd,0 4px 8px #0005}.district{position:absolute;background:#553821dd;color:#f8e5bc;border:1px solid #d0a568;border-radius:999px;padding:5px 9px;font:bold 10px Arial;letter-spacing:.5px;z-index:2;box-shadow:0 3px 7px #0005}.north{left:37%;top:4%}.residential{left:6%;top:31%}.granary{right:5%;top:20%}.craft{right:6%;bottom:31%}.dockyard{left:6%;bottom:8%}.farms{left:3%;top:8%;background:#b6a55b;color:#382a18}.zone{position:absolute;background:#f0d9a8dd;color:#55351f;border:2px solid #6d452a;border-radius:8px;padding:5px 8px;font:bold 10px Arial;box-shadow:0 3px 8px #0004;z-index:5}.farm{left:3%;top:39%}.mount{left:3%;top:22%}.work{right:3%;top:39%}.port{right:3%;bottom:13%}.tree{position:absolute;width:16px;height:16px;background:#42623b;border-radius:50%;border:3px solid #718a4d;box-shadow:0 2px 4px #0005;z-index:1}.tree:after{content:"";position:absolute;width:4px;height:8px;background:#704a2c;left:3px;top:12px}.t1{left:14%;top:17%}.t2{left:18%;top:82%}.t3{left:83%;top:12%}.t4{left:86%;top:83%}.t5{left:8%;top:62%}.t6{left:91%;top:56%}.t7{left:76%;top:90%}.t8{left:26%;top:90%}.road{position:absolute;background:#d4b57a99;border:2px solid #98734a55;z-index:0}.road.h{left:12%;right:12%;height:13px;top:49%;transform:rotate(-2deg)}.road.v{top:13%;bottom:13%;width:12px;left:50%;transform:rotate(4deg)}.space{position:absolute;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#f5e2b9,#d8b87d);border:2px solid #65432a;color:#55351f;font:bold 12px Arial;z-index:8;box-shadow:0 4px 7px #0005,inset 0 0 0 2px #fff4;transform:rotate(-2deg)}.space:nth-child(even){transform:rotate(2deg)}.pawn{position:absolute;width:25px;height:25px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 8px #0009;z-index:12;transition:all .4s}.pawns{position:absolute;inset:0}.redbg{background:#c75b49}.goldbg{background:#d4a444}.jadebg{background:#5d9b70}.indigobg{background:#5e7fb1}
.side{display:grid;gap:12px;align-content:start}.card{background:linear-gradient(145deg,#31241a,#211812);border:1px solid #67482e;border-radius:13px;padding:13px}.card h3{margin:0 0 10px;color:#efd29d}.resources{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.res{background:#17120e;border:1px solid #4d3624;border-radius:8px;padding:8px;font:13px Arial}.res b{float:right;color:#f1d19b}.builds{display:grid;grid-template-columns:1fr 1fr;gap:7px}.build{background:#17120e;border:1px solid #4d3624;border-radius:8px;padding:9px;font:12px Arial;cursor:pointer;color:#f2e1c4}.build:hover{border-color:#b78448}.build:disabled{opacity:.4;cursor:not-allowed}.build span{display:block;color:#bda98d;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{padding:12px;border-radius:9px;border:1px solid #8e6239;background:#a8753e;color:#1c1209;font-weight:bold}.action.secondary{background:#3a2a1e;color:#f0dfc2}.action:disabled{opacity:.4}.event{background:#efe0be;color:#3c2819;border-radius:10px;padding:12px}.event h4{margin:0 0 5px}.log{max-height:150px;overflow:auto;font:12px/1.5 Arial;color:#d5c2a5}.chat{display:flex;gap:6px}.chat input{flex:1}.chatlog{max-height:100px;overflow:auto;font:12px Arial;color:#d5c2a5}.scoreRow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #493424;font:13px Arial}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#f0d39c;color:#24170f;padding:11px 16px;border-radius:10px;font:bold 13px Arial;box-shadow:0 8px 25px #0008;z-index:30}
.modal{position:fixed;inset:0;background:#080604cc;display:grid;place-items:center;z-index:20;padding:20px}.modalbox{max-width:560px;width:100%;background:#2a1e15;border:1px solid #8d6239;border-radius:18px;padding:28px;text-align:center;box-shadow:0 25px 80px #000}.winner{font-size:60px}.modal h2{font-size:38px;color:#f0d39c;margin:8px}.score{font-size:22px;color:#d7bd94}
@media(max-width:900px){.landing{grid-template-columns:1fr}.game{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.shell{padding:10px}.landing,.lobby{padding:18px}.game{padding:8px}.hero h1{font-size:46px}.brand{font-size:22px}.builds{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><div><div class="brand">HARAPPA</div><div class="tag">BUILD • TRADE • GROW</div></div><div class="small">Indus Valley Strategy Game</div></div>
<div id="app"></div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script>
const socket=io();let state=null,myId=null,lastDice=0;
const app=document.getElementById("app"),toastEl=document.getElementById("toast"),modal=document.getElementById("modal");
const colors=["red","gold","jade","indigo"],icons=["🌾","⛰️","?","🏺","🌾","🚢","?","⛰️","🌾","🏺","?","🌾"];
function toast(t){toastEl.textContent=t;toastEl.classList.remove("hidden");setTimeout(()=>toastEl.classList.add("hidden"),2200)}
function beep(freq=440,dur=.09){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch{}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function me(){return state?.players.find(p=>p.id===myId)}
function renderLanding(){
app.innerHTML=`<section class="screen landing"><div class="hero"><div class="seal">🐂</div><h1>Build a city.<br>Shape history.</h1><p>Lead a Harappan settlement, gather resources, build the Great Bath and drainage systems, trade with rival settlements and survive the river's surprises.</p><div class="small">2–4 players • 6 rounds • online multiplayer</div></div><form class="form" id="joinForm"><input class="input" id="name" maxlength="18" placeholder="Your name" required><div class="row"><button class="btn" id="create">CREATE ROOM</button><button class="btn dark" type="button" id="join">JOIN ROOM</button></div><input class="input hidden" id="code" maxlength="6" placeholder="6-character room code"><div class="error" id="err"></div><div class="small">Create a room, then send the code to your friends.</div></form></section>`;
document.getElementById("create").onclick=e=>{e.preventDefault();const n=document.getElementById("name").value;socket.emit("createRoom",{name:n},r=>{if(r.ok){myId=socket.id;toast("Room created: "+r.code);renderLobby(r.code)}else showErr(r.error)})};
document.getElementById("join").onclick=()=>{const c=document.getElementById("code");c.classList.remove("hidden");c.focus();document.getElementById("join").textContent="JOIN NOW";document.getElementById("join").onclick=()=>{const n=document.getElementById("name").value;socket.emit("joinRoom",{name:n,code:c.value},r=>{if(r.ok){myId=socket.id;renderLobby(r.code)}else showErr(r.error)})}};
}
function showErr(t){document.getElementById("err").textContent=t}
function renderLobby(code){
app.innerHTML=`<section class="screen lobby"><div class="small">ROOM CODE</div><div class="code">${code}</div><p class="small">Send this code to Shubhra / your other players. Everyone opens the same website and chooses JOIN ROOM.</p><div class="players" id="lplayers"></div><div class="row"><button class="btn" id="ready">READY</button><button class="btn" id="start">START GAME</button><button class="btn dark" id="leave">BACK</button></div><p class="small">The host can start once 2–4 players are ready.</p></section>`;
document.getElementById("ready").onclick=()=>socket.emit("toggleReady");
document.getElementById("start").onclick=()=>socket.emit("startGame");
document.getElementById("leave").onclick=()=>{location.reload()};
updateLobby();
}
function updateLobby(){
if(!state)return;const box=document.getElementById("lplayers");if(!box)return;
box.innerHTML=state.players.map(p=>`<div class="player"><span class="dot ${p.color}"></span><b>${escapeHtml(p.name)}</b><div class="${p.ready?"ready":"waiting"}">${p.ready?"✓ READY":"Waiting…"}</div>${p.id===state.host?'<div class="small">HOST</div>':""}</div>`).join("");
const mep=me();document.getElementById("ready").textContent=mep?.ready?"UNREADY":"READY";document.getElementById("start").disabled=state.host!==myId;
}
function boardPos(i){const pts=[[8,8],[27,8],[48,8],[70,8],[89,10],[90,43],[90,73],[70,87],[47,88],[25,88],[8,72],[7,42]];const [x,y]=pts[i%pts.length];return `left:calc(${x}% - 19px);top:calc(${y}% - 19px)`}
function renderGame(){
const p=me(),yourTurn=state.turn===myId;
app.innerHTML=`<section class="screen game"><div class="boardWrap"><div class="gamebar"><div class="turn">${yourTurn?"⚔ YOUR TURN":"⏳ "+escapeHtml(state.players.find(x=>x.id===state.turn)?.name||"Player")+"'s turn"}</div><div class="round">ROUND ${state.round} / 6</div></div><div class="board"><div class="river"></div><div class="road h"></div><div class="road v"></div><div class="bridge one"></div><div class="bridge two"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div><div class="tree t6"></div><div class="tree t7"></div><div class="tree t8"></div><div class="city"><div class="cityTitle">CITADEL • HARAPPAN QUARTER</div><div class="bath">GREAT<br>BATH</div></div><div class="district north">CITADEL</div><div class="district residential">LOWER TOWN</div><div class="district granary">GRANARY</div><div class="district craft">CRAFT DISTRICT</div><div class="district dockyard">DOCKYARD</div><div class="zone farm">🌾 FARMLAND</div><div class="zone mount">⛰️ HILLS</div><div class="zone work">🏺 WORKSHOPS</div><div class="zone port">🚢 TRADE PORT</div><div id="spaces"></div><div class="pawns" id="pawns"></div></div><div class="small" style="padding:8px 3px">Roll → collect → choose one action → event → end turn.</div></div>
<aside class="side">
<div class="card"><h3>YOUR SETTLEMENT</h3><div class="resources">${res("🌾","Food",p.food)}${res("🧱","Bricks",p.bricks)}${res("⚒️","Metal",p.metal)}${res("💎","Beads",p.beads)}${res("🪙","Trade",p.trade)}<div class="res">🏆 Prosperity <b>${p.prosperity}</b></div></div></div>
<div class="card"><h3>ACTIONS</h3><div class="actions"><button class="action" id="roll" ${!yourTurn||p.rolled?"disabled":""}>🎲 ROLL ${p.rolled?`(${p.rolled})`:""}</button><button class="action secondary" id="explore" ${!yourTurn||!p.rolled||p.acted?"":"disabled"}>🗺️ EXPLORE</button><button class="action secondary" id="tradeBtn" ${!yourTurn||!p.rolled||p.acted?"":"disabled"}>🤝 TRADE</button><button class="action" id="end" ${!yourTurn||!p.rolled||!p.acted?"disabled":""}>END TURN →</button></div></div>
<div class="card"><h3>BUILD</h3><div class="builds">${build("house","🏠","House","2🧱 + 1🌾","+2")}${build("drainage","💧","Drainage","2🧱 + 1⚒️","+3")}${build("bath","🛁","Great Bath","3🧱 + 1🪙","+4 • needs Drainage")}${build("workshop","🏺","Workshop","1🧱 + 1⚒️ + 1💎","+3")}${build("tradecentre","🚢","Trade Centre","2🧱 + 2🪙","+4")}</div></div>
<div class="card"><h3>PLAYERS</h3>${state.players.map(x=>`<div class="scoreRow"><span><span class="dot ${x.color}"></span>${escapeHtml(x.name)}</span><b>${x.prosperity} P</b></div>`).join("")}</div>
<div class="card"><h3>CHAT</h3><div class="chatlog" id="chatlog"></div><div class="chat"><input class="input" id="chatInput" maxlength="120" placeholder="Say something…"><button class="btn" id="sendChat">↗</button></div></div>
<div class="card"><h3>GAME LOG</h3><div class="log" id="log"></div></div>
</aside></section>`;
document.getElementById("roll").onclick=()=>{socket.emit("roll");beep(320,.1)};
document.getElementById("explore").onclick=()=>socket.emit("explore");
document.getElementById("tradeBtn").onclick=tradeDialog;
document.getElementById("end").onclick=()=>socket.emit("endTurn");
document.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>{socket.emit("build",{type:b.dataset.build});beep(520,.08)});
document.getElementById("sendChat").onclick=sendChat;document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
renderSpaces();renderPawns();
}
function res(i,n,v){return `<div class="res">${i} ${n}<b>${v}</b></div>`}
function build(t,i,n,c,g){return `<button class="build" data-build="${t}" ${state.turn!==myId||!me().rolled||me().acted?"disabled":""}>${i} <b>${n}</b><span>${c} → ${g}</span></button>`}
function renderSpaces(){const s=document.getElementById("spaces");if(!s)return;s.innerHTML=icons.map((x,i)=>`<div class="space" style="${boardPos(i)}">${x}</div>`).join("")}
function renderPawns(){const s=document.getElementById("pawns");if(!s)return;s.innerHTML=state.players.map(p=>`<div class="pawn ${p.color}bg" style="${boardPos(p.pos)}" title="${escapeHtml(p.name)}"></div>`).join("")}
function pos(i){const a=i/12*Math.PI*2-Math.PI/2;return `left:calc(50% + ${Math.cos(a)*43}% - 15px);top:calc(50% + ${Math.sin(a)*43}% - 15px)`} 
function tradeDialog(){
const others=state.players.filter(p=>p.id!==myId);if(!others.length)return;
const t=prompt("Trade with: "+others.map((x,i)=>`${i+1}. ${x.name}`).join(" | ")+"\nEnter player number");
const target=others[Number(t)-1];if(!target)return;
const give=prompt("You give 1 of: food / bricks / metal / beads / trade");const want=prompt("You receive 1 of: food / bricks / metal / beads / trade");
if(give&&want)socket.emit("trade",{targetId:target.id,give,want});
}
function sendChat(){const i=document.getElementById("chatInput");if(i&&i.value.trim()){socket.emit("chat",i.value.trim());i.value=""}}
function addLog(t){const x=document.getElementById("log");if(x)x.innerHTML=`<div>${t}</div>`+x.innerHTML}
function addChat(m){const x=document.getElementById("chatlog");if(x)x.innerHTML+=`<div><b>${escapeHtml(m.name)}:</b> ${escapeHtml(m.text)}</div>`;if(x)x.scrollTop=x.scrollHeight}
function showEvent(e){beep(660,.14);modal.classList.remove("hidden");document.getElementById("modalBox").innerHTML=`<div class="winner">${e.icon}</div><h2>${escapeHtml(e.title)}</h2><p>${escapeHtml(e.text)}</p><div class="score">${escapeHtml(e.result)}</div><button class="btn" id="closeModal">CONTINUE</button>`;document.getElementById("closeModal").onclick=()=>modal.classList.add("hidden")}
function showWinner(w){modal.classList.remove("hidden");beep(880,.18);setTimeout(()=>beep(1040,.18),180);document.getElementById("modalBox").innerHTML=`<div class="winner">🏆</div><h2>${w.winners.map(escapeHtml).join(" & ")}</h2><p class="score">Most Prosperous Harappan City</p><p>${w.score} Prosperity Points</p><button class="btn" id="closeWin">VIEW BOARD</button>`;document.getElementById("closeWin").onclick=()=>modal.classList.add("hidden")}
socket.on("connect",()=>{myId=socket.id;if(!state)renderLanding()});
socket.on("state",s=>{state=s;if(!state.started){if(document.querySelector(".lobby"))updateLobby();else renderLobby(state.code)}else renderGame()});
socket.on("toast",toast);socket.on("log",m=>{addLog(m);beep(220,.05)});socket.on("chat",addChat);
socket.on("eventCard",showEvent);socket.on("gameOver",showWinner);
socket.on("dice",d=>{if(d.player===myId){lastDice=d.value;beep(380+d.value*45,.13)}});
socket.on("disconnect",()=>toast("Connection lost — reconnecting…"));
renderLanding();
</script>
</body>
</html>
